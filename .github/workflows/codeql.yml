# CodeQL Workflow
# Goal: Run semantic security analysis for code touched by agents.
# Suggested use: Use when agent changes touch code paths where static analysis evidence is required.

name: CodeQL Workflow

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "{{path_or_glob}}"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  codeql_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Document expectations
        run: |
          echo "Goal: {{goal}}"
          echo "Owner: {{owner}}"
          echo "Evidence required: {{evidence}}"
      - name: Run validation
        run: |
          {{validation_command}}
