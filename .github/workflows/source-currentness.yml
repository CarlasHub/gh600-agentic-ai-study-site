name: Weekly source currentness check

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-currentness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run content QA
        run: npm run qa:content
      - name: Check source currentness
        run: npm run check:sources
      - name: Run data accuracy scan
        run: npm run data:accuracy
      - name: Upload accuracy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh600-accuracy-reports
          path: |
            docs/SOURCE_CURRENTNESS_REPORT.md
            docs/DATA_ACCURACY_REPORT.md
            docs/DATA_ACCURACY_ACTION_LOG.md
